services:
  - type: web
    name: lolas-tasty-bites
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        value: change-this-secret-key
      - key: ADMIN_PASSWORD
        value: lolas123
      - key: FLASK_DEBUG
        value: "0"
